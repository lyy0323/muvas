<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>和诗以歌 数字黑胶画布</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231C1917'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23F4F0EC'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%231C1917'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="components.css" />
  <style>
    /* =========================================================
       1. Design Tokens & Theme Palette (Yuye-pink)
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    /* Ambient Glow driven by Web Audio AnalyserNode */
    .ambient-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(88px);
      will-change: transform, opacity;
      transition: opacity 0.25s ease;
    }

    .ambient-orb--1 {
      width: 56vw;
      height: 56vw;
      max-width: 720px;
      max-height: 720px;
      top: -18%;
      left: -10%;
      background: radial-gradient(circle, var(--theme-accent) 0%, transparent 70%);
      opacity: calc(0.14 + var(--audio-energy) * 0.22);
      transform: scale(calc(1 + var(--audio-energy) * 0.14));
    }

    .ambient-orb--2 {
      width: 48vw;
      height: 48vw;
      max-width: 640px;
      max-height: 640px;
      bottom: -20%;
      right: -8%;
      background: radial-gradient(circle, var(--theme-accent) 0%, transparent 70%);
      opacity: calc(0.1 + var(--audio-energy) * 0.18);
      transform: scale(calc(1 + var(--audio-energy) * 0.12));
    }

    /* =========================================================
       2. Fixed Minimalist Editorial Header
       ========================================================= */
    .floating-header {
      position: fixed;
      top: 14px;
      touch-action: none;
      left: 50%;
      transform: translateX(-50%);
      width: min(1280px, calc(100vw - 28px));
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: 0 14px 36px -18px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.18);
    }

    .brand-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-primary);
    }

    .brand-artist {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: var(--radius-pill);
      background: rgba(28, 25, 23, 0.05);
      border: 1px solid var(--border-subtle);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .pill-btn:hover {
      background: var(--theme-accent-soft);
      border-color: var(--theme-accent);
    }

    .pill-btn:active {
      transform: scale(0.97);
    }

    .pill-btn.is-playing {
      background: var(--theme-accent-soft);
      border-color: var(--theme-accent);
    }

    .timecode {
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* =========================================================
       3. Infinite Canvas Viewport & World Layer (all breakpoints)
       ========================================================= */
    .canvas-viewport {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      cursor: grab;
      background-image: radial-gradient(rgba(255, 255, 255, 0.09) 1px, transparent 1px);
      background-size: 28px 28px;
      background-position: 0px 0px;
      touch-action: none;
    }

    .canvas-viewport.is-panning {
      cursor: grabbing;
    }

    .canvas-viewport.space-ready {
      cursor: grab;
    }

    .canvas-world {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* 镜头拉远：文字与低清缩略图保留，只暂停阴影/动画并降低刷新 */
    .canvas-world.is-far .widget-card {
      box-shadow: none !important;
      transition: none !important;
    }

    .canvas-world.is-far .widget-card:not(.c-marker) {
      pointer-events: none;
    }

    .canvas-world.is-far .drag-handle-zone,
    .canvas-world.is-far .resize-handle {
      visibility: hidden !important;
    }

    .canvas-world.is-far .c-record__eq i,
    .canvas-world.is-far .c-visual__glow,
    .canvas-world.is-far .c-visual.is-playing .c-visual__art {
      animation: none !important;
    }

    /* 桌面：卡片由 JS 按 data-col/row 绝对定位，空位保留、不自动补位，坐标可为负 */
    .spatial-grid {
      position: relative;
      width: 0;
      height: 0;
    }

    /* 窄屏只压缩 header，画布本身在所有尺寸下都是同一套无限画布 */
    @media (max-width: 768px) {
      .floating-header {
        top: 10px;
        width: calc(100vw - 20px);
        padding: 8px 12px;
      }
    }

    @media (max-width: 480px) {
      /* 手机上让 header 收成一行，把更多高度留给画布 */
      .brand-artist {
        display: none;
      }
    }

    /* =========================================================
       4. Widget Card, Top Drag Zone & Bottom-Right Resize Handle
       ========================================================= */
    .widget-card,
    .drag-placeholder {
      position: relative;
      border-radius: var(--radius-card);
    }

    /* 卡片壳的视觉部分在 components.css 的 .c-card；这里只保留画布行为 */
    .widget-card {
      container-type: size;
      container-name: widget;
      cursor: default;
    }

    .widget-card:not(.is-active-cluster):hover {
      box-shadow: var(--shadow-card-hover);
      border-color: rgba(28, 25, 23, 0.12);
    }

    /* --- Top Edge Long-Press Drag-to-Reorder Zone --- */
    .drag-handle-zone {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 28px;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
    }

    .drag-handle-zone:active {
      cursor: grabbing;
    }

    .drag-pill {
      width: 34px;
      height: 4px;
      border-radius: 99px;
      background: rgba(28, 25, 23, 0.16);
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease, width 0.2s ease;
    }

    .c-card--dark .drag-pill {
      background: rgba(255, 255, 255, 0.38);
    }

    .widget-card:hover .drag-pill,
    .drag-handle-zone:hover .drag-pill {
      opacity: 0.85;
      transform: translateY(0);
    }

    /* 触摸设备：拖拽区/缩放手柄在屏幕上至少 40px，并常显拖拽提示 */
    @media (pointer: coarse) {
      .drag-handle-zone {
        height: max(28px, calc(40px / var(--cam-scale, 1)));
      }
      .drag-pill {
        opacity: 0.55;
        transform: translateY(0);
      }
      .widget-card .resize-handle {
        width: max(30px, calc(40px / var(--cam-scale, 1)));
        height: max(30px, calc(40px / var(--cam-scale, 1)));
      }
    }

    .widget-card.is-holding .drag-pill {
      opacity: 1;
      background: var(--theme-accent);
      width: 44px;
    }

    .widget-card.is-lifted {
      z-index: 90 !important;
      box-shadow: var(--shadow-lifted), 0 0 0 2.5px var(--theme-accent) !important;
      border-color: var(--theme-accent) !important;
      pointer-events: none;
      will-change: transform, left, top;
    }

    .drag-placeholder {
      background: var(--theme-accent-soft);
      border: 2px dashed var(--theme-accent);
    }

    /* --- Bottom-Right Drag-to-Resize Handle --- */
    .resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 30px;
      height: 30px;
      z-index: 26;
      cursor: nwse-resize;
      touch-action: none;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 7px;
      opacity: 0.32;
      transition: opacity 0.2s ease;
    }

    .widget-card:hover .resize-handle,
    .resize-handle:hover,
    .widget-card.is-resizing .resize-handle {
      opacity: 0.95;
    }

    .resize-handle svg {
      width: 13px;
      height: 13px;
      color: var(--text-secondary);
      transition: color 0.2s ease;
    }

    .c-card--dark .resize-handle svg {
      color: rgba(248, 242, 245, 0.85);
    }

    .resize-handle:hover svg,
    .widget-card.is-resizing .resize-handle svg {
      color: var(--text-primary);
    }

    .c-card--dark .resize-handle:hover svg {
      color: var(--theme-accent);
    }

    /* Translucent theme-accent snap preview overlay (strictly hidden when inactive) */
    .resize-preview-ghost {
      position: fixed;
      z-index: 80;
      display: none;
      opacity: 0;
      pointer-events: none;
      border-radius: var(--radius-card);
      background: var(--theme-accent-soft);
      border: 2px dashed var(--theme-accent);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      transition:
        width 0.16s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.16s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .resize-preview-ghost.visible {
      display: block;
      opacity: 1;
    }

    /* =========================================================
       15. Cluster Map: Record / Story / Visual + Track Panel
       ========================================================= */
    /* --- equalizer bars (panel) --- */
    .eq-bars {
      display: none;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }

    .is-playing .eq-bars {
      display: inline-flex;
    }

    .eq-bars i {
      width: 2px;
      height: 5px;
      border-radius: 1px;
      background: var(--cluster-accent);
      transform-origin: bottom center;
      animation: eqPulse 0.9s ease-in-out infinite;
    }

    .eq-bars i:nth-child(2) {
      height: 9px;
      animation-delay: 0.18s;
    }

    .eq-bars i:nth-child(3) {
      height: 7px;
      animation-delay: 0.36s;
    }

    @keyframes eqPulse {
      0%, 100% { transform: scaleY(0.45); }
      50% { transform: scaleY(1.1); }
    }

    /* --- track index panel --- */
    .now-playing-label {
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .tracks-btn-text {
      color: var(--text-muted);
    }

    .track-panel {
      position: fixed;
      top: 76px;
      right: 14px;
      z-index: 60;
      width: min(346px, calc(100vw - 28px));
      padding: 14px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      box-shadow: 0 22px 60px -24px rgba(45, 34, 62, 0.4);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px) scale(0.98);
      transform-origin: top right;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .track-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }

    .track-panel-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .track-panel-cover {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-panel-meta {
      min-width: 0;
    }

    .track-panel-title {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
    }

    .track-panel-sub {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .track-panel-list {
      list-style: none;
      margin-top: 8px;
      max-height: min(54vh, 420px);
      overflow-y: auto;
      scrollbar-width: none;
    }

    .track-panel-list::-webkit-scrollbar {
      display: none;
    }

    .track-panel-item {
      display: grid;
      grid-template-columns: 20px 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .track-panel-item:hover {
      background: var(--theme-accent-soft);
    }

    .track-panel-item.is-active {
      background: var(--theme-accent-soft);
    }

    .tp-num {
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .track-panel-item.is-active .tp-num {
      color: var(--cluster-accent);
    }

    .tp-main {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .tp-name {
      font-family: var(--font-serif);
      font-size: 13.5px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-panel-item.is-active .tp-name {
      font-weight: 700;
    }

    .tp-dur {
      font-size: 10.5px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    .track-panel-foot {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
      text-align: right;
    }

    .track-panel-foot a {
      font-size: 10.5px;
      color: var(--text-muted);
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .track-panel-foot a:hover {
      color: var(--text-primary);
    }

    /* --- bottom hint --- */
    .canvas-hint {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 20;
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      background: rgba(244, 240, 236, 0.78);
      border: 1px solid var(--border-subtle);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 10.5px;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      pointer-events: none;
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .track-panel {
        top: 72px;
        right: 12px;
      }
    }

    @media (max-width: 640px) {
      .tracks-btn-text {
        display: none;
      }
      .now-playing-label {
        max-width: 84px;
      }
      .canvas-hint {
        display: none;
      }
      .track-panel {
        width: calc(100vw - 24px);
        left: 12px;
        right: 12px;
      }
    }

    @media (max-width: 430px) {
      .btn-label {
        display: none;
      }
      .pill-btn {
        padding: 6px 10px;
      }
      .now-playing-label {
        max-width: 66px;
      }
    }

  </style>
  </head>
<body>
  <div class="ambient-backdrop" aria-hidden="true">
    <div class="ambient-orb ambient-orb--1"></div>
    <div class="ambient-orb ambient-orb--2"></div>
  </div>

  <!-- Resize Snap Preview Ghost -->
  <div class="resize-preview-ghost" id="resizePreviewGhost" aria-hidden="true"></div>

  <!-- Fixed Editorial Header -->
  <header class="floating-header">
    <div class="brand-group">
      <span class="brand-title">和诗以歌</span>
      <span class="brand-artist">上海交通大学国学社 乐府部</span>
    </div>

    <div class="header-controls">
      <button class="pill-btn" id="headerPlayBtn" type="button" aria-label="播放或暂停">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" id="headerPlayIcon">
          <path d="M8 5v14l11-7z" />
        </svg>
        <span class="timecode" id="headerTimecode">00:00 / 04:13</span>
      </button>

      <button class="pill-btn" id="btnTracks" type="button" aria-expanded="false" aria-controls="trackPanel">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 6h16M4 12h16M4 18h10" />
        </svg>
        <span class="tracks-btn-text">曲目</span>
        <span class="now-playing-label" id="nowPlayingLabel">大东</span>
      </button>

      <button class="pill-btn" id="btnReturnCentroid" type="button" aria-label="回到质心">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="7" />
          <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
        </svg>
        <span class="btn-label">回到质心</span>
      </button>
    </div>
  </header>

  <!-- Track Index Panel -->
  <div class="track-panel" id="trackPanel" aria-hidden="true">
    <div class="track-panel-head">
      <img class="track-panel-cover" src="assets/img/album.jpg" alt="《和诗以歌》专辑封面" />
      <div class="track-panel-meta">
        <div class="track-panel-title">和诗以歌</div>
        <div class="track-panel-sub">六首 / 点击飞往对应画布</div>
      </div>
    </div>
    <ol class="track-panel-list" id="trackPanelList" aria-label="专辑曲目"></ol>
    <div class="track-panel-foot"><a href="ui.html">UI 组件库 ↗</a></div>
  </div>

  <!-- Infinite Canvas Viewport -->
  <main class="canvas-viewport" id="canvasViewport">
    <div class="canvas-world" id="canvasWorld">
      <section class="spatial-grid" id="spatialGrid" aria-label="音乐空间画布">
        <!-- 六组曲目卡片由脚本生成 -->
      </section>
    </div>
  </main>

  <div class="canvas-hint" aria-hidden="true">拖动画布 / 点编号飞往单曲 / 点唱片播放</div>

  <script>
    (() => {
      'use strict';

      // 禁用浏览器级页面缩放：画布内的双指缩放仍由 pointer 手势处理
      ['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
        document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
      });
      const ALBUM = {
        title: '和诗以歌',
        artist: '上海交通大学国学社 乐府部',
        cover: 'assets/img/album.jpg',
        coverAlt: '《和诗以歌》专辑封面',
        tracks: [
          {
            id: "dadong",
            title: "大东",
            subtitle: "《诗经》小雅",
            artist: "林雨夜 / 木狸奴",
            date: "2024.05.17",
            chapter: "悲歌",
            quote: "“维天有汉，监亦有光”",
            image: "assets/img/stories/dadong.jpg",
            accent: "#A8452C",
            accentSoft: "rgba(168, 69, 44, 0.14)",
            src: "assets/audio/dadong.m4a",
            duration: 253.128,
            credits: [["词","《诗经》小雅"],["曲","木猫、林雨夜"],["编曲","林雨夜"],["唱","ACE小夜"],["出品","上海交通大学国学社"]],
            story: [
              { h: false, t: "“人不可能两次踏入一条河流。”对于《大东》的创作者木猫来说，这首歌诞生于一个无法复制的夜晚。" },
              { h: true, t: "若合一契的悲歌" },
              { h: false, t: "故事始于本科时期一段压抑的时光。那时的木猫正处于生活的低谷，“风波迭起，芳情不度”。在一种强烈的“去国怀乡”的情绪中，他偶然刷到了《诗经》大东的讲解视频。" },
              { h: false, t: "这是三千年前殷商遗民的歌谣：天上的银河灿烂，地上的征役无休；贵族享乐，百姓赤贫。这种跨越时空的苦闷，让木猫瞬间产生了一种“若合一契”的战栗——他仿佛听懂了那些仰望星空的古人。" },
              { h: true, t: "灵感与格律的交响" },
              { h: false, t: "《大东》的原诗结构奇特，前四段沉郁质实，后三段却瑰丽奇崛，仿佛是由两篇不同的作品拼接而成。创作的过程也呼应了这种结构。" },
              { h: false, t: "在那次灵感迸发的洗澡间隙，木猫脑海中突然闪过黄霑《沧海一声笑》的豪迈，决定用宫商角徵羽的五声音阶起头，一气呵成谱写了后半段的高潮——既不可张扬宏大，也不能流于琐碎，那是压抑后的爆发。" },
              { h: false, t: "而前半段的叙事，则由林雨夜（椰椰）深度参与。她用国学社一贯坚持的“依字行腔”原则，对旋律进行了精细的打磨与调整，弥补了原本音准上的瑕疵，让古老的文字在现代的律动中找到了最准确的咬字与呼吸。" },
              { h: true, t: "四点半的绝响" },
              { h: false, t: "那是一个疯狂的夜晚。两位创作者，一间小房间，床与钢琴，凌晨四点半。“用情绪的花火拼凑出曲调”，木猫说，即便后来远渡重洋，拥有了更好的独立空间，他也再没能复刻那一晚纯粹的无拘表达。" },
              { h: false, t: "《大东》不仅是一首复古之作，它更像是一个现代灵魂与古老历史的握手。闭上眼睛，你似乎能听到那来自东方的歌谣：他们痛苦，他们悲歌，但他们依然在星空下，顶天立地地活着。" },

            story: [
              { h: false, t: "在国学社，音韵与格律始终是大家敬畏的核心。作曲者林雨夜自2019年起，便坚持在创作中探索“依字行腔”，并将这一理念带入了乐府部。但一个问题始终萦绕在大家心中：“古诗词的格律到底有什么意义？我们能用现代的音乐把它们唱出来吗？”" },
              { h: false, t: "2022年下半年的一天，为了回答这个“终极问题”，她决定不做理论探讨，而是直接交出一份答卷。" },
              { h: false, t: "她选择了诗圣杜甫的《月夜》，一首格律严谨的五言律诗，以此为“考题”，创作了一段demo。这次创作的核心原则只有一个——彻底的“依字行腔”。她没有添加华丽的编曲，也没有刻意设计抓耳的旋律，而是让曲调完全服务于汉字本身的四声。当“今夜鄜州月”的“夜”字（去声）自然下降，当“香雾云鬟湿”的“湿”字（入声，现代读阴平）自然收束，奇妙的事情发生了。" },
              { h: false, t: "“唱起来真的和普通话念起来差不多。”——这句评价，恰恰是对这份demo最高的赞扬。它证明了古人传承千年的“格律”，并非束缚创作的枷锁，而是汉语与生俱来的音乐蓝图。诗词的平仄起伏，本身就是旋律。" },
              { h: false, t: "这个小样在社团内部流传，它所蕴含的对语言本身的尊重和“人文关怀”触动了大家。2025年初，这个珍贵的demo被重新制作和打磨，正式定名为《未解忆长安》发布。" },
              { h: false, t: "正如一位听众的留言：“谢谢椰椰做出这么好的音乐，每次听都感觉自己平静下来。”这份平静，或许就来自于旋律与语言最本真的和谐。" },

            story: [
              { h: false, t: "《来春可拟共兰舟》的背后，是一个关于守护与承诺的故事。" },
              { h: false, t: "故事的主角是国学社一位特别的“编外人员”。她因偶然的契机加入，一直默默地为社团提供支持。故事的开端，是她远在衢州游览时写下的一首七律，诗中“醉卧州衢思上海，神离海上望衢州”的句子，遥寄着她对上海朋友们的思念。" },
              { h: false, t: "一年后，一个惊险的插曲猝然而至。远在上海的国学社诸君惊闻她陷入了生命垂危的困境。在焦急万分、四处联系打探安危的时刻，林雨夜含泪写下了第二首诗。她采用了那位朋友原诗的韵脚——这在古典诗词中被称为“次韵”，本身就带有一种“你来我往”的深切回应。" },
              { h: false, t: "这首诗，是一份最沉痛的祈愿。诗中写道：“彼岸休行多劫火，来春可拟共兰舟？”这不仅是一句问话，更是一个拼尽全力的锚点。它试图为一个深陷绝望、看不到未来希望的人，重新构建一个具体的、关于“下个春天”的期待。“无常若是有情客，也请归人到此州。”（如果无常懂得哪怕一点点感情，也请让远行的人回到这里来吧。）" },
              { h: false, t: "万幸，这份祈愿得到了回应。朋友转危为安。" },
              { h: false, t: "又过了一年，两位朋友终于团聚。第三首“次韵”诗，记录下这“于今携手小船头”的动人场景。经历了“人事凋零无去路”的幽谷，才更懂“兰心缱绻愿同舟”的珍贵。暖风缓缓地吹过，正如同《论语》中“莫春者，春服既成，冠者五六人，童子六七人，浴乎沂，风乎舞雩，咏而归”的图景，是一种历经风雨后的平静与新生。因此，这首歌被设计为一场两位歌者的对唱，并以“依字行腔”的旋律，去承载这三首格律诗的重量。它所唱的，不只是音韵，更是一个用诗词和友情“约到”的春天。" },

            story: [
              { h: true, t: "缘起：“这已经不只是作业了”" },
              { h: false, t: "歌曲的监制，来自上海交通大学文创学院的洪若馨，在一次关于“上海图书馆痛点解决方案”的课程作业中，选择了一个鲜为人知的切入点——古籍文献修复。当她采访修复老师时，对方平静地说：“他们所做的只是希望让人们形成文化尊重。”" },
              { h: false, t: "这句话深深打动了若馨。她意识到，这群“古籍医生”日复一日地埋首故纸，在“寂寂寒窗”中“打点模糊文字”，所求的并非功名，而仅仅是一份尊重。若馨在后来的分享中写道：“这个作业对我来说就已经不是作业了，是发自内心的想去做一些东西。”" },
              { h: true, t: "集结：“国学社有很多很厉害的人”" },
              { h: false, t: "怀着这份感动，若馨带着她的“大方案”——包括展览、绘本，以及一个核心的“歌曲”——在国学社发出了求助。她知道这里“可以写诗词歌赋”，也听说大家“打算开始自己尝试作曲”。" },
              { h: false, t: "这封真诚的“小作文”如同一颗石子投入湖中，激起了国学社成员们内心深处的共鸣。这不仅是一个技术上的挑战，更是一次“有深意的事情”。" },
              { h: false, t: "大家的热情被点燃了。作词人归荑接过了重任，没有停留在空泛的想象，而是深入研究了若馨带回的古籍修复资料，将“函套”、“拓片”、“研墨”、“挑纹理”等复杂的工序，化作“挽一抔故土流沙”、“拓一笔往日锋芒”的诗意表达。作曲与编曲林雨夜则用悠扬的古风旋律，将这份跨越千年的匠心与孤寂娓娓道来。" },
              { h: true, t: "新生：乐府部的诞生" },
              { h: false, t: "从一个人的感动，到一个团队的共创，《溯流沙》的创作过程，展现了社团成员间惊人的协作力与共同的人文关怀。大家的目标高度一致：不仅要创作一首好听的歌，更要传递那份“文化尊重”的内核。" },
              { h: false, t: "更具意义的是，在《溯流沙》的创作过程中，国学社内部这股对音乐创作的热情与力量不断汇聚，最终催生了“乐府部”的正式诞生。2021年12月5日，乐府部正式成立，由陈鲲鹏任部长、李雨桐任副部长。" },
              { h: false, t: "《溯流沙》不仅是乐府部的开山之作，它本身也成为了一个最佳范本：它源自对传统文化的深度关怀，并由一群志同道合的年轻人协作完成。这首歌的背后，是一个社团从自发的情感共鸣，走向有建制、有传承的文化实践的生动故事。" },

            story: [
              { h: false, t: "《聚少趁江南》是一首极具实验性质的“集句”歌曲。全曲歌词并非全新创作，而是从两位主角多年来相互赠答、唱和的三十余首诗词作品中，精选摘录并重新“剪辑”而成。这首歌像是一部情感的蒙太奇，将“东中院小窗”的同窗记忆、“巴山夜雨”的异地相思，以及无数个“灯轻帐暖”的瞬间，拼贴成一幅完整的流动的画卷。它不仅是一首歌曲，更是两位诗人用平仄与韵脚堆叠出的一份厚重的编年史。" },
              { h: true, t: "拼贴：碎金重铸的“集句”艺术" },
              { h: false, t: "“集句”是中国古典文学中一种极高难度的创作方式，要求作者将前人（或自己）的零散诗句，重新组合成意脉贯通的新篇。 《聚少趁江南》将这一传统做到了极致。歌词中，“银汉漂漂”的宏大天象与“雨碎春衫薄”的细腻体感无缝衔接，每一句都来自不同的时空，却在旋律中奇迹般地指向了同一个主题——离别与重逢。这三十余首诗词，原本散落在聊天记录、手稿和朋友圈的角落，此刻却如碎金重铸，被赋予了全新的生命。" },
              { h: true, t: "唱和：两颗灵魂的加密通话" },
              { h: false, t: "在歌词的字里行间，隐藏着大量只有两位当事人才懂的“密码”。从“那年冬日夜，海棠花下坐”的静谧，到“万里丹山路，巴山与谁话”的遥望，每一句都是一次灵魂的呼应。 这不仅是文学上的切磋，更是一种深情的生活记录。当语言不足以表达思念时，她们选择用诗词对话。这种“唱和”的传统，在现代快节奏的语境下显得尤为奢侈和珍贵。这首歌，就是她们将无数次“见字如面”的瞬间，凝结成的永恒琥珀。" },
              { h: true, t: "惜时：苦芯燃尽后的余温" },
              { h: false, t: "“苦芯燃剩一丝甘，今生聚少趁江南。” 这句反复吟唱的Hook，是整首歌的题眼。在经历了“波声衔信小”的等待和“顾影入烟深”的孤独后，所有的情绪最终落地于对当下的珍惜。 哪怕是“东中院”的一扇小窗，哪怕是“狸奴”慵懒的一瞥，只要是“聚时”，便值得用尽全力去铭记。人生如寄，聚散无常，唯有趁着这美好的时光，哪怕只有那一杯“余温”，也要痛快地共饮。" },

      const envelopeCache = new Map();

      function getEnergyEnvelope(trackId) {
        if (!trackId) return null;
        if (envelopeCache.has(trackId)) return envelopeCache.get(trackId);

        const encoded = ENERGY_ENVELOPES[trackId];
        let bytes = null;
        if (encoded) {
          try {
            const binary = atob(encoded);
            bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          } catch (err) {
            bytes = null;
          }
        }

        envelopeCache.set(trackId, bytes);
        return bytes;
      }

      /* =========================================================
         2. Real Album Audio Engine (HTMLAudioElement + Analyser)
         ========================================================= */
      class AlbumAudioEngine {
        constructor() {
          this.audio = new Audio();
          this.audio.preload = 'metadata';
          this.audio.volume = 0.92;

          this.duration = 0;
          this.isPlaying = false;
          this.smoothedEnergy = 0;
          this.lastFrameTs = 0;
          this.onEnded = null;
          this.onPlaybackError = null;

          this.ctx = null;
          this.analyser = null;
          this.waveData = null;
          this.analyserReady = false;
          this.useAnalyser = false;
          this.envelope = null;
          this.envRate = ENERGY_ENVELOPE_RATE;
          this.pendingSeek = null;

          this.audio.addEventListener('play', () => {
            this.isPlaying = true;
          });

          this.audio.addEventListener('pause', () => {
            // 切歌时旧音源的 pause 事件可能晚到，用 paused 兜住避免把新曲标成暂停
            if (this.audio.paused) this.isPlaying = false;
          });

          this.audio.addEventListener('ended', () => {
            this.isPlaying = false;
            if (typeof this.onEnded === 'function') this.onEnded();
          });

          this.audio.addEventListener('loadedmetadata', () => {
            if (Number.isFinite(this.audio.duration) && this.audio.duration > 0) {
              this.duration = this.audio.duration;
            }
            if (this.pendingSeek != null) {
              try {
                this.audio.currentTime = this.pendingSeek;
              } catch (err) {
                /* ignore */
              }
              this.pendingSeek = null;
            }
          });

          this.audio.addEventListener('error', () => {
            console.warn('Audio failed to load:', this.audio.src);
          });
        }

        get currentTime() {
          return Number.isFinite(this.audio.currentTime) ? this.audio.currentTime : 0;
        }

        set currentTime(value) {
          try {
            this.audio.currentTime = value;
          } catch (err) {
            /* 元数据还没到时 seek 会抛错，忽略即可 */
          }
        }

        load(track) {
          this.duration = Number.isFinite(track.duration) ? track.duration : 0;
          this.isPlaying = false;
          this.smoothedEnergy = 0;
          this.envelope = getEnergyEnvelope(track.id);
          this.audio.src = track.src;
          this.audio.load();
        }

        /**
         * 只在 http(s) 下接 AnalyserNode。
         * 用 file:// 直接双击打开时，本地媒体会被当作跨域资源，
         * createMediaElementSource 会让声音变哑，所以那种情况让 <audio> 直出，
         * 视觉能量改用一层随播放推进的包络。
         */
        initAnalyser() {
          if (this.analyserReady) return;
          if (location.protocol === 'file:') return;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;

          try {
            if (!this.ctx) this.ctx = new AudioCtx();
            const source = this.ctx.createMediaElementSource(this.audio);
            this.analyser = this.ctx.createAnalyser();
            this.analyser.fftSize = 256;
            this.analyser.smoothingTimeConstant = 0.82;
            this.waveData = new Uint8Array(this.analyser.fftSize);
            source.connect(this.analyser);
            this.analyser.connect(this.ctx.destination);
            this.analyserReady = true;
            this.useAnalyser = true;
          } catch (err) {
            console.warn('Analyser unavailable, falling back to envelope:', err);
            this.analyser = null;
            this.useAnalyser = false;
          }
        }

        play() {
          this.initAnalyser();
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }

          this.isPlaying = true;
          this.lastFrameTs = performance.now();

          const promise = this.audio.play();
          if (promise && typeof promise.catch === 'function') {
            promise.catch((err) => {
              if (!this.audio.paused) return;
              console.warn('Playback blocked:', err);
              this.isPlaying = false;
              if (typeof this.onPlaybackError === 'function') this.onPlaybackError(err);
            });
          }
        }

        pause() {
          this.isPlaying = false;
          this.audio.pause();
        }

        toggle() {
          this.isPlaying ? this.pause() : this.play();
        }

        seek(seconds, autoPlay = false) {
          if (!Number.isFinite(seconds)) return;
          const max = this.duration > 0 ? this.duration - 0.05 : 0;
          const target = Math.max(0, max > 0 ? Math.min(seconds, max) : seconds);
          try {
            this.audio.currentTime = target;
          } catch (err) {
            /* ignore */
          }
          if (autoPlay && !this.isPlaying) this.play();
        }

        tick(nowTs) {
          let rawEnergy = 0;

          if (this.isPlaying) {
            if (this.useAnalyser && this.analyser && this.waveData) {
              // 用波形 RMS 而不是频谱均值：真实歌曲的低频能量很容易把频谱打满，
              // RMS 保留呼吸感，暗段与副歌的亮度差才拉得开
              this.analyser.getByteTimeDomainData(this.waveData);
              let sum = 0;
              for (let i = 0; i < this.waveData.length; i++) {
                const v = (this.waveData[i] - 128) / 128;
                sum += v * v;
              }
              const rms = Math.sqrt(sum / this.waveData.length);
              // 这批录音整体偏轻（均值约 -20 dBFS），用 dB 映射而不是线性 RMS，
              // 轻唱段与副歌的亮度差才看得见
              const db = 20 * Math.log10(rms + 1e-6);
              rawEnergy = Math.min(1, Math.max(0, (db + 48) / 32));
            } else if (this.envelope && this.envelope.length > 1) {
              const pos = this.currentTime * this.envRate;
              const i = Math.min(this.envelope.length - 1, Math.max(0, Math.floor(pos)));
              const j = Math.min(this.envelope.length - 1, i + 1);
              const frac = pos - Math.floor(pos);
              const a = this.envelope[i];
              const b = this.envelope[j];
              rawEnergy = Math.max(0, (a + (b - a) * frac) / 255);
            } else {
              const t = this.currentTime;
              const breath = 0.5 + 0.5 * Math.sin(t * 1.15) * Math.sin(t * 0.37 + 1.2);
              rawEnergy = 0.16 + 0.28 * breath;
            }
          }

          this.smoothedEnergy += (rawEnergy - this.smoothedEnergy) * 0.12;
          if (Number.isFinite(nowTs)) this.lastFrameTs = nowTs;
          return this.smoothedEnergy;
        }
      }
