<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>夜航船 · 数字黑胶画布</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* =========================================================
       1. Design Tokens & Theme Palette (Yuye-pink)
       ========================================================= */
    :root {
      --bg-canvas: #F8F2F5;
      --accent: #DDD4ED;
      --accent-strong: #C2B2E0;
      --accent-soft: rgba(221, 212, 237, 0.45);
      --text-primary: #1C1917;
      --text-secondary: #57534E;
      --text-muted: #8A817C;

      --surface-card: #FFFFFF;
      --surface-paper: #FCF9F5;
      --surface-note: #FDFBF7;
      --border-subtle: rgba(28, 25, 23, 0.07);

      --radius-card: 16px;
      --radius-pill: 999px;

      --shadow-card:
        0 1px 2px rgba(28, 25, 23, 0.04),
        0 8px 24px -6px rgba(68, 52, 79, 0.08),
        0 2px 6px -1px rgba(28, 25, 23, 0.03);
      --shadow-card-hover:
        0 2px 4px rgba(28, 25, 23, 0.05),
        0 14px 32px -8px rgba(68, 52, 79, 0.13);
      --shadow-lifted:
        0 22px 48px -10px rgba(45, 34, 62, 0.24),
        0 8px 20px -4px rgba(28, 25, 23, 0.12);

      --font-sans: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Noto Serif SC', Georgia, serif;

      --audio-energy: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    /* Ambient Glow driven by Web Audio AnalyserNode */
    .ambient-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(88px);
      will-change: transform, opacity;
      transition: opacity 0.25s ease;
    }

    .ambient-orb--1 {
      width: 56vw;
      height: 56vw;
      max-width: 720px;
      max-height: 720px;
      top: -18%;
      left: -10%;
      background: radial-gradient(circle, #DDD4ED 0%, rgba(221, 212, 237, 0) 70%);
      opacity: calc(0.45 + var(--audio-energy) * 0.45);
      transform: scale(calc(1 + var(--audio-energy) * 0.14));
    }

    .ambient-orb--2 {
      width: 48vw;
      height: 48vw;
      max-width: 640px;
      max-height: 640px;
      bottom: -20%;
      right: -8%;
      background: radial-gradient(circle, #EEDAE5 0%, rgba(238, 218, 229, 0) 70%);
      opacity: calc(0.4 + var(--audio-energy) * 0.4);
      transform: scale(calc(1 + var(--audio-energy) * 0.12));
    }

    /* Subtle paper grain overlay */
    .paper-grain {
      position: relative;
    }
    .paper-grain::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* =========================================================
       2. Fixed Minimalist Editorial Header
       ========================================================= */
    .floating-header {
      position: fixed;
      top: 14px;
      touch-action: none;
      left: 50%;
      transform: translateX(-50%);
      width: min(1280px, calc(100vw - 28px));
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-card);
      box-shadow: 0 4px 20px rgba(28, 25, 23, 0.05);
    }

    .brand-group {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text-primary);
    }

    .brand-artist {
      font-size: 12.5px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: var(--radius-pill);
      background: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }

    .pill-btn:hover {
      background: var(--accent);
      border-color: var(--accent-strong);
    }

    .pill-btn:active {
      transform: scale(0.97);
    }

    .pill-btn.is-playing {
      background: var(--accent);
      border-color: var(--accent-strong);
    }

    .timecode {
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* =========================================================
       3. Infinite Canvas Viewport & World Layer (all breakpoints)
       ========================================================= */
    .canvas-viewport {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      cursor: grab;
      background-image: radial-gradient(rgba(28, 25, 23, 0.11) 1px, transparent 1px);
      background-size: 28px 28px;
      background-position: 0px 0px;
      touch-action: none;
    }

    .canvas-viewport.is-panning {
      cursor: grabbing;
    }

    .canvas-viewport.space-ready {
      cursor: grab;
    }

    .canvas-world {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    /* 桌面：卡片由 JS 按 data-col/row 绝对定位，空位保留、不自动补位，坐标可为负 */
    .spatial-grid {
      position: relative;
      width: 0;
      height: 0;
    }

    /* 窄屏只压缩 header，画布本身在所有尺寸下都是同一套无限画布 */
    @media (max-width: 768px) {
      .floating-header {
        top: 10px;
        width: calc(100vw - 20px);
        padding: 8px 12px;
      }
    }

    @media (max-width: 480px) {
      /* 手机上让 header 收成一行，把更多高度留给画布 */
      .brand-artist {
        display: none;
      }
    }

    /* =========================================================
       4. Widget Card, Top Drag Zone & Bottom-Right Resize Handle
       ========================================================= */
    .widget-card,
    .drag-placeholder {
      position: relative;
      border-radius: var(--radius-card);
    }

    .widget-card {
      background: var(--surface-card);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transition: box-shadow 0.25s ease, border-color 0.25s ease;
      container-type: size;
      container-name: widget;
      cursor: default;
    }

    .widget-card:hover {
      box-shadow: var(--shadow-card-hover);
      border-color: rgba(28, 25, 23, 0.12);
    }

    /* --- Top Edge Long-Press Drag-to-Reorder Zone --- */
    .drag-handle-zone {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 28px;
      z-index: 25;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
    }

    .drag-handle-zone:active {
      cursor: grabbing;
    }

    .drag-pill {
      width: 34px;
      height: 4px;
      border-radius: 99px;
      background: rgba(28, 25, 23, 0.16);
      opacity: 0;
      transform: translateY(-2px);
      transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease, width 0.2s ease;
    }

    .widget-card.dark-chrome .drag-pill {
      background: rgba(255, 255, 255, 0.38);
    }

    .widget-card:hover .drag-pill,
    .drag-handle-zone:hover .drag-pill {
      opacity: 0.85;
      transform: translateY(0);
    }

    /* 触摸设备：拖拽区/缩放手柄在屏幕上至少 40px，并常显拖拽提示 */
    @media (pointer: coarse) {
      .drag-handle-zone {
        height: max(28px, calc(40px / var(--cam-scale, 1)));
      }
      .drag-pill {
        opacity: 0.55;
        transform: translateY(0);
      }
      .widget-card .resize-handle {
        width: max(30px, calc(40px / var(--cam-scale, 1)));
        height: max(30px, calc(40px / var(--cam-scale, 1)));
      }
    }

    .widget-card.is-holding .drag-pill {
      opacity: 1;
      background: var(--accent-strong);
      width: 44px;
    }

    .widget-card.is-lifted {
      z-index: 90 !important;
      box-shadow: var(--shadow-lifted), 0 0 0 2.5px var(--accent) !important;
      border-color: var(--accent-strong) !important;
      pointer-events: none;
      will-change: transform, left, top;
    }

    .drag-placeholder {
      background: rgba(221, 212, 237, 0.34);
      border: 2px dashed var(--accent-strong);
    }

    /* --- Bottom-Right Drag-to-Resize Handle --- */
    .resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 30px;
      height: 30px;
      z-index: 26;
      cursor: nwse-resize;
      touch-action: none;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 7px;
      opacity: 0.32;
      transition: opacity 0.2s ease;
    }

    .widget-card:hover .resize-handle,
    .resize-handle:hover,
    .widget-card.is-resizing .resize-handle {
      opacity: 0.95;
    }

    .resize-handle svg {
      width: 13px;
      height: 13px;
      color: var(--text-secondary);
      transition: color 0.2s ease;
    }

    .widget-card.dark-chrome .resize-handle svg {
      color: rgba(248, 242, 245, 0.85);
    }

    .resize-handle:hover svg,
    .widget-card.is-resizing .resize-handle svg {
      color: var(--text-primary);
    }

    .widget-card.dark-chrome .resize-handle:hover svg {
      color: var(--accent);
    }

    /* Translucent #DDD4ED Snap Preview Overlay (strictly hidden when inactive) */
    .resize-preview-ghost {
      position: fixed;
      z-index: 80;
      display: none;
      opacity: 0;
      pointer-events: none;
      border-radius: var(--radius-card);
      background: rgba(221, 212, 237, 0.32);
      border: 2px dashed var(--accent-strong);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
      transition:
        width 0.16s cubic-bezier(0.22, 1, 0.36, 1),
        height 0.16s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .resize-preview-ghost.visible {
      display: block;
      opacity: 1;
    }

    /* =========================================================
       5. Widget 1: Skeuomorphic Vinyl Player (VinylPlayer)
       ========================================================= */
    .vinyl-card {
      background: linear-gradient(145deg, #FBF8FA 0%, #F2ECF4 100%);
      padding: 20px 18px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .turntable-deck {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      gap: 18px;
    }

    .platter-wrap {
      position: relative;
      width: min(250px, 78cqmin);
      height: min(250px, 78cqmin);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .platter-rim {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: linear-gradient(135deg, #E7E2E9 0%, #C7BFCF 50%, #F5F2F6 100%);
      box-shadow:
        0 10px 24px rgba(28, 25, 23, 0.16),
        inset 0 1px 2px rgba(255, 255, 255, 0.9);
    }

    .vinyl-disc {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background:
        repeating-radial-gradient(
          circle at center,
          #161517 0px,
          #161517 2px,
          #211F24 3px,
          #161517 4px
        );
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.06),
        inset 0 0 28px rgba(0, 0, 0, 0.85);
      will-change: transform;
      cursor: pointer;
    }

    .vinyl-sheen {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 20deg,
        transparent 0deg,
        rgba(255, 255, 255, 0.13) 34deg,
        transparent 72deg,
        transparent 180deg,
        rgba(221, 212, 237, 0.16) 218deg,
        transparent 255deg
      );
      pointer-events: none;
    }

    .vinyl-label {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 38%;
      height: 38%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #EFE9F7 0%, #DDD4ED 62%, #BEB0DB 100%);
      border: 3px solid #1C1917;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      color: var(--text-primary);
      box-shadow: inset 0 1px 4px rgba(255, 255, 255, 0.65);
    }

    .vinyl-label-title {
      font-family: var(--font-serif);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0.06em;
    }

    .vinyl-spindle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #FFFFFF, #9E97A6);
      border: 1px solid rgba(28, 25, 23, 0.35);
      z-index: 3;
    }

    .vinyl-overlay-play {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(28, 25, 23, 0.72);
      backdrop-filter: blur(6px);
      color: #FFFFFF;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .vinyl-overlay-play:hover {
      background: #1C1917;
      transform: translate(-50%, -50%) scale(1.06);
    }

    /* Interactive Tonearm */
    .tonearm-assembly {
      position: absolute;
      top: 8px;
      right: 14px;
      width: 68px;
      height: 210px;
      pointer-events: none;
      z-index: 5;
    }

    .tonearm-base {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #FFFFFF 0%, #D5CFD9 55%, #A69EAD 100%);
      border: 1px solid rgba(28, 25, 23, 0.18);
      box-shadow: 0 4px 10px rgba(28, 25, 23, 0.16);
    }

    .tonearm-pivot {
      position: absolute;
      top: 28px;
      right: 28px;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      transform: rotate(6deg);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
    }

    .tonearm-pivot.dragging {
      transition: none;
      cursor: grabbing;
    }

    .tonearm-rod {
      position: absolute;
      top: 0;
      left: -3px;
      width: 6px;
      height: 152px;
      border-radius: 3px;
      background: linear-gradient(90deg, #9B95A1 0%, #F4F1F6 45%, #847D8B 100%);
      box-shadow: 2px 4px 8px rgba(28, 25, 23, 0.2);
    }

    .tonearm-headshell {
      position: absolute;
      top: 142px;
      left: -8px;
      width: 16px;
      height: 30px;
      border-radius: 4px 4px 6px 6px;
      background: linear-gradient(135deg, #2D2A32 0%, #1C1917 100%);
      transform: rotate(18deg);
      box-shadow: 0 4px 8px rgba(28, 25, 23, 0.3);
    }

    .tonearm-headshell::after {
      content: "";
      position: absolute;
      bottom: 4px;
      left: 5px;
      width: 6px;
      height: 3px;
      border-radius: 2px;
      background: var(--accent);
    }

    .vinyl-controls {
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 4;
      padding-right: 12px;
    }

    .track-info-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
    }

    .track-info-artist {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .transport-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tactile-play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: var(--text-primary);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(28, 25, 23, 0.22);
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .tactile-play-btn:hover {
      transform: scale(1.05);
      background: #2E2926;
    }

    .tactile-play-btn:active {
      transform: scale(0.95);
    }

    .progress-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .progress-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 99px;
      background: rgba(28, 25, 23, 0.1);
      outline: none;
      cursor: pointer;
    }

    .progress-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--text-primary);
      border: 2px solid var(--accent);
      box-shadow: 0 2px 6px rgba(28, 25, 23, 0.25);
      cursor: pointer;
    }

    .progress-times {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    /* @container for VinylPlayer */
    @container widget (max-width: 340px) and (max-height: 260px) {
      .vinyl-card {
        padding: 12px;
        justify-content: center;
      }
      .vinyl-controls,
      .tonearm-assembly {
        display: none;
      }
      .platter-wrap {
        width: 152px;
        height: 152px;
      }
      .vinyl-overlay-play {
        display: inline-flex;
      }
    }

    @container widget (min-width: 341px) and (max-height: 260px) {
      .vinyl-card {
        flex-direction: row;
        align-items: center;
        gap: 18px;
        padding: 16px 22px;
      }
      .turntable-deck {
        flex: 0 0 auto;
      }
      .platter-wrap {
        width: 154px;
        height: 154px;
      }
      .tonearm-assembly {
        display: none;
      }
      .vinyl-controls {
        flex: 1;
        min-width: 0;
      }
    }

    @container widget (max-width: 400px) and (min-height: 261px) and (max-height: 340px) {
      .vinyl-card {
        padding: 18px 16px 14px;
      }
      .platter-wrap {
        width: 164px;
        height: 164px;
      }
      .tonearm-assembly {
        transform: scale(0.76);
        transform-origin: top right;
        top: 6px;
        right: 12px;
      }
      .track-info-title {
        font-size: 16px;
      }
    }

    /* =========================================================
       6. Widget 2: Editorial LRC Lyrics Card (EditorialLyrics)
       ========================================================= */
    .lyrics-card {
      background: var(--surface-paper);
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 24px 22px 20px;
    }

    .lyrics-scroll {
      position: relative;
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      padding: 28px 4px;
      scrollbar-width: none;
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .lyrics-scroll::-webkit-scrollbar {
      display: none;
    }

    .lyric-line {
      padding: 8px 14px;
      margin-bottom: 6px;
      border-radius: 10px;
      font-family: var(--font-serif);
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .lyric-line:hover {
      color: var(--text-primary);
      background: rgba(221, 212, 237, 0.25);
    }

    .lyric-line.active {
      color: var(--text-primary);
      font-weight: 700;
      font-size: 18.5px;
      background: var(--accent);
      box-shadow: 0 2px 10px rgba(221, 212, 237, 0.55);
      transform: translateX(4px);
    }

    .lyrics-spotlight {
      display: none;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 4px;
      cursor: pointer;
    }

    .lyrics-spotlight-text {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 700;
      line-height: 1.55;
      color: var(--text-primary);
      background: linear-gradient(transparent 62%, var(--accent) 62%);
      display: inline;
    }

    @container widget (max-width: 340px) and (max-height: 260px) {
      .lyrics-scroll {
        display: none;
      }
      .lyrics-spotlight {
        display: flex;
      }
    }

    @container widget (max-height: 260px) and (min-width: 341px) {
      .lyrics-card {
        padding: 18px 18px 14px;
      }
      .lyrics-scroll {
        padding: 14px 2px;
      }
      .lyric-line {
        font-size: 14.5px;
        padding: 5px 10px;
      }
      .lyric-line.active {
        font-size: 16.5px;
      }
    }

    /* =========================================================
       7. Widget 3: Tactile Note Card (TactileNote)
       ========================================================= */
    .note-card {
      background: var(--surface-note);
      height: 100%;
      padding: 26px 22px 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      background-image: linear-gradient(to bottom, transparent 27px, rgba(28, 25, 23, 0.04) 28px);
      background-size: 100% 28px;
    }

    .washi-tape {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(-1.5deg);
      width: 92px;
      height: 20px;
      background: rgba(221, 212, 237, 0.78);
      border-left: 2px dotted rgba(255, 255, 255, 0.75);
      border-right: 2px dotted rgba(255, 255, 255, 0.75);
      box-shadow: 0 2px 6px rgba(28, 25, 23, 0.07);
      pointer-events: none;
      z-index: 5;
    }

    .note-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .note-title {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .note-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    .note-body {
      flex: 1;
      overflow-y: auto;
      font-size: 13.5px;
      line-height: 1.85;
      color: var(--text-secondary);
      scrollbar-width: none;
    }

    .note-body::-webkit-scrollbar {
      display: none;
    }

    .note-body p + p {
      margin-top: 10px;
    }

    .note-extended {
      display: none;
    }

    .note-signature {
      display: none;
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px dashed rgba(28, 25, 23, 0.12);
      font-family: var(--font-serif);
      font-size: 13px;
      color: var(--text-primary);
      text-align: right;
    }

    .note-pullquote {
      display: none;
      flex: 1;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6px;
    }

    .note-pullquote-mark {
      font-family: var(--font-serif);
      font-size: 30px;
      line-height: 1;
      color: var(--accent-strong);
      margin-bottom: 4px;
    }

    .note-pullquote-text {
      font-family: var(--font-serif);
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.65;
      color: var(--text-primary);
    }

    @container widget (max-width: 340px) and (max-height: 260px) {
      .note-header,
      .note-body {
        display: none;
      }
      .note-pullquote {
        display: flex;
      }
    }

    @container widget (min-height: 320px) {
      .note-extended,
      .note-signature {
        display: block;
      }
      .note-title {
        font-size: 19px;
      }
      .note-body {
        font-size: 14.5px;
      }
    }

    /* =========================================================
       8. Widget 4: Clean MV Visual Canvas (MediaVideo)
       ========================================================= */
    .mv-card {
      position: relative;
      width: 100%;
      height: 100%;
      background: #14121A;
      cursor: pointer;
      overflow: hidden;
    }

    .mv-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .mv-overlay-bottom {
      position: absolute;
      inset: auto 0 0 0;
      padding: 24px 16px 12px;
      background: linear-gradient(to top, rgba(16, 14, 22, 0.78) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: #F8F2F5;
      pointer-events: none;
    }

    .mv-caption-title {
      font-family: var(--font-serif);
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .mv-progress-track {
      width: 100%;
      height: 2.5px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    .mv-progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    /* =========================================================
       9. Widget 5: Editorial Media Image Card (MediaImage)
       ========================================================= */
    .image-card {
      position: relative;
      width: 100%;
      height: 100%;
      background: #1C1924;
      overflow: hidden;
      cursor: zoom-in;
    }

    .image-artwork {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: 50% 45%;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .image-card:hover .image-artwork {
      transform: scale(1.04);
    }

    .image-caption {
      position: absolute;
      inset: auto 0 0 0;
      padding: 24px 16px 12px;
      background: linear-gradient(to top, rgba(20, 17, 26, 0.72), transparent);
      color: #F8F2F5;
      pointer-events: none;
    }

    .image-caption-title {
      font-family: var(--font-serif);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* =========================================================
       10. Lightbox Modal
       ========================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 120;
      background: rgba(24, 20, 30, 0.74);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-panel {
      position: relative;
      width: min(860px, 94vw);
      max-height: 86vh;
      background: #16141D;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .modal-backdrop.open .modal-panel {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      color: #F8F2F5;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-family: var(--font-serif);
      font-size: 14px;
    }

    .modal-close {
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #FFFFFF;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .modal-close:hover {
      background: var(--accent);
      color: var(--text-primary);
    }

    .modal-body {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #121018;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .modal-body canvas,
    .modal-body svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
